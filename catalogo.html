<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6366F1">
    <meta name="description" content="Catálogo de productos - Pedidos Cruz">
    <title>Catálogo de Productos - Pedidos Cruz</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
    <style>
        :root {
            --primary: #6366F1;
            --primary-light: #818CF8;
            --primary-dark: #4338CA;
            --primary-50: #EEF2FF;
            --primary-100: #E0E7FF;
            --secondary: #7C3AED;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --bg: #F8FAFC;
            --surface: #FFFFFF;
            --text: #0F172A;
            --text-secondary: #475569;
            --text-muted: #94A3B8;
            --border: #E2E8F0;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.1);
            --gradient: linear-gradient(135deg, #6366F1 0%, #8B5CF6 50%, #A855F7 100%);
            --radius: 14px;
            --radius-lg: 20px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* HERO */
        .hero {
            background: var(--gradient);
            color: #fff;
            padding: 50px 20px 80px;
            position: relative;
            overflow: hidden;
        }
        .hero::before, .hero::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            pointer-events: none;
        }
        .hero::before { width: 400px; height: 400px; top: -120px; right: -100px; }
        .hero::after { width: 250px; height: 250px; bottom: -120px; left: -80px; }
        .hero-content {
            position: relative;
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }
        .hero-logo {
            width: 80px;
            height: 80px;
            background: rgba(255,255,255,0.2);
            border-radius: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-bottom: 18px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
        }
        .hero h1 {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }
        .hero p {
            font-size: 16px;
            opacity: 0.92;
            max-width: 540px;
            margin: 0 auto;
        }

        /* CONTAINER */
        .container {
            max-width: 1280px;
            margin: -40px auto 60px;
            padding: 0 16px;
            position: relative;
            z-index: 1;
        }

        /* TOOLBAR */
        .toolbar-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
        }
        .search-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 14px 18px 14px 50px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-50);
        }
        .search-box i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 18px;
        }
        .result-count {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }
        .categorias-chips {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: thin;
        }
        .chip {
            padding: 8px 16px;
            border: 2px solid var(--border);
            border-radius: 24px;
            background: var(--surface);
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s;
            user-select: none;
        }
        .chip:hover { border-color: var(--primary-light); color: var(--primary); }
        .chip.active {
            background: var(--gradient);
            color: #fff;
            border-color: transparent;
        }

        /* GRID */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }
        .product {
            background: var(--surface);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }
        .product:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-lg);
        }
        .product-img {
            width: 100%;
            aspect-ratio: 1;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            padding: 14px;
        }
        .product-img img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.3s;
        }
        .product:hover .product-img img { transform: scale(1.06); }
        .product-img i {
            font-size: 64px;
            color: var(--text-muted);
        }
        .product-zoom {
            position: absolute;
            bottom: 12px;
            right: 12px;
            width: 38px;
            height: 38px;
            background: rgba(255,255,255,0.95);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--primary);
            box-shadow: var(--shadow);
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        .product:hover .product-zoom { opacity: 1; }
        .orden-select {
            padding: 12px 14px;
            border: 2px solid #E2E8F0;
            border-radius: 12px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            background: #fff;
            color: #334155;
            cursor: pointer;
        }
        .product-nuevo {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: #10B981;
            color: #fff;
            font-size: 10.5px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 10px;
            letter-spacing: 0.6px;
            box-shadow: 0 2px 8px rgba(16,185,129,.4);
        }
        .product-cat {
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--gradient);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 12px;
            letter-spacing: 0.3px;
            box-shadow: var(--shadow);
        }
        .product-body {
            padding: 16px 18px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border-top: 1px solid var(--border);
        }
        .product-codigo {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 4px;
            letter-spacing: 0.3px;
        }
        .product-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 10px;
            line-height: 1.35;
            min-height: 40px;
        }
        .product-price {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary);
            margin-top: auto;
            letter-spacing: -0.5px;
        }

        /* EMPTY */
        .empty {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }
        .empty i { font-size: 64px; opacity: 0.4; margin-bottom: 16px; }
        .empty h3 { font-size: 20px; color: var(--text-secondary); margin-bottom: 6px; }

        /* LOADING */
        .loading {
            text-align: center;
            padding: 60px 20px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            margin: 0 auto;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15,23,42,0.6);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s, visibility 0.2s;
        }
        .modal-overlay.show { opacity: 1; visibility: visible; }
        .modal {
            background: var(--surface);
            border-radius: var(--radius-lg);
            max-width: 700px;
            width: 100%;
            max-height: 95vh;
            overflow-y: auto;
            transform: scale(0.95);
            transition: transform 0.2s;
            position: relative;
        }
        .modal-overlay.show .modal { transform: scale(1); }
        .modal-img {
            width: 100%;
            min-height: 320px;
            max-height: 65vh;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 24px;
            cursor: zoom-in;
        }
        .modal-img img {
            max-width: 100%;
            max-height: 60vh;
            width: auto;
            height: auto;
            object-fit: contain;
        }
        .modal-img i { font-size: 100px; color: var(--text-muted); }

        /* FULLSCREEN IMAGE */
        .img-fullscreen {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s;
        }
        .img-fullscreen.show { opacity: 1; visibility: visible; }
        .img-fullscreen img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            cursor: zoom-out;
        }
        .img-fullscreen-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 48px;
            height: 48px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }
        .modal-body { padding: 24px; }
        .modal-cat {
            display: inline-block;
            background: var(--primary-50);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .modal h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .modal .precio {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 16px;
        }
        .modal .codigo {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        .modal .descripcion {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }
        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.95);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--text);
            z-index: 10;
            box-shadow: var(--shadow);
        }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-muted);
            font-size: 13px;
        }
        footer a { color: var(--primary); text-decoration: none; font-weight: 600; }

        @media (max-width: 640px) {
            .hero { padding: 36px 16px 64px; }
            .hero h1 { font-size: 28px; }
            .products-grid {
                grid-template-columns: 1fr 1fr;
                gap: 14px;
            }
            .product-body { padding: 12px 14px 16px; }
            .product-name { font-size: 14px; min-height: 38px; }
            .product-price { font-size: 20px; }
            .product-img { padding: 10px; }
            .modal .precio { font-size: 28px; }
            .modal-img { min-height: 240px; padding: 16px; }
        }
        @media (min-width: 1100px) {
            .products-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>
<body>

    <div class="hero">
        <div class="hero-content">
            <div class="hero-logo"><i class="fas fa-boxes-stacked"></i></div>
            <h1>Catálogo de Productos</h1>
            <p>Conoce nuestra variedad de productos y precios. Contacta a tu vendedor para hacer tu pedido.</p>
        </div>
    </div>

    <div class="container">
        <div class="toolbar-card">
            <div class="search-row">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search" placeholder="Buscar producto por nombre o código...">
                </div>
                <select id="orden" class="orden-select" title="Ordenar">
                    <option value="nombre">A-Z</option>
                    <option value="reciente">Más recientes</option>
                    <option value="antiguo">Más antiguos</option>
                    <option value="precio_asc">Precio menor</option>
                    <option value="precio_desc">Precio mayor</option>
                </select>
                <div class="result-count" id="result-count">Cargando...</div>
            </div>
            <div class="categorias-chips" id="categorias-chips"></div>
        </div>

        <div id="products-area">
            <div class="loading"><div class="spinner"></div></div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal">
            <button class="modal-close" id="modal-close"><i class="fas fa-times"></i></button>
            <div class="modal-img" id="modal-img"></div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <div class="img-fullscreen" id="img-fullscreen">
        <button class="img-fullscreen-close" id="img-fullscreen-close"><i class="fas fa-times"></i></button>
        <img id="img-fullscreen-src" src="" alt="">
    </div>

    <footer>
        Catálogo público • <a href="index.html">Acceso vendedores</a>
    </footer>

    <script>
        const API = 'https://pedidosgb.innovacion-digital.com/api/public';
        const UPLOADS = API + '/uploads/productos/';

        let allProductos = [];
        let categorias = [];
        let categoriaActiva = '';
        // Enlace de catálogo de un vendedor: catalogo.html?c=codigo
        const CATALOGO = new URLSearchParams(location.search).get('c') || '';
        const conCatalogo = p => { if (CATALOGO) p.set('c', CATALOGO); return p; };

        function formatNumber(n) {
            return parseFloat(n || 0).toLocaleString('es-CO', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
        }

        function debounce(fn, delay) {
            let t;
            return function(...args) { clearTimeout(t); t = setTimeout(() => fn.apply(this, args), delay); };
        }

        async function cargarCategorias() {
            try {
                const resp = await fetch(API + '/catalogo/categorias?' + conCatalogo(new URLSearchParams()).toString());
                const data = await resp.json();
                categorias = data.categorias || [];
                renderCategorias();
            } catch (err) { console.error(err); }
        }

        function renderCategorias() {
            const c = document.getElementById('categorias-chips');
            c.innerHTML = `<div class="chip ${categoriaActiva === '' ? 'active' : ''}" data-id="">Todas</div>` +
                categorias.map(cat => `<div class="chip ${categoriaActiva == cat.id_categoria ? 'active' : ''}" data-id="${cat.id_categoria}">${cat.nombre}</div>`).join('');
            c.querySelectorAll('.chip').forEach(el => {
                el.addEventListener('click', () => {
                    categoriaActiva = el.dataset.id;
                    renderCategorias();
                    cargarProductos();
                });
            });
        }

        async function cargarProductos() {
            const area = document.getElementById('products-area');
            area.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

            const term = document.getElementById('search').value.trim();
            const params = new URLSearchParams();
            if (categoriaActiva) params.set('id_categoria', categoriaActiva);
            if (term) params.set('buscar', term);

            try {
                const resp = await fetch(API + '/catalogo?' + conCatalogo(params).toString());
                const data = await resp.json();
                if (data.privado) {
                    document.getElementById('result-count').textContent = '';
                    area.innerHTML = `<div class="empty"><i class="fas fa-lock"></i><h3>Catálogo privado</h3><p>${data.mensaje}</p></div>`;
                    return;
                }
                if (data.catalogo) {
                    document.querySelector('.hero h1').textContent = data.catalogo.nombre;
                    if (data.catalogo.descripcion) document.querySelector('.hero p').textContent = data.catalogo.descripcion;
                    document.title = data.catalogo.nombre + ' - Catálogo';
                }
                allProductos = data.productos || [];
                renderProductos();
            } catch (err) {
                console.error(err);
                area.innerHTML = '<div class="empty"><i class="fas fa-exclamation-circle"></i><h3>Error al cargar productos</h3><p>Intenta nuevamente</p></div>';
            }
        }

        function esNuevo(p) {
            return p.created_at && (Date.now() - new Date(String(p.created_at).replace(' ', 'T')).getTime()) < 15 * 86400000;
        }

        function ordenar(lista) {
            const modo = document.getElementById('orden').value, l = [...lista];
            if (modo === 'reciente') return l.sort((a, b) => b.id_producto - a.id_producto);
            if (modo === 'antiguo') return l.sort((a, b) => a.id_producto - b.id_producto);
            if (modo === 'precio_asc') return l.sort((a, b) => a.precio - b.precio);
            if (modo === 'precio_desc') return l.sort((a, b) => b.precio - a.precio);
            return l.sort((a, b) => a.nombre.localeCompare(b.nombre));
        }

        function renderProductos() {
            const area = document.getElementById('products-area');
            const count = document.getElementById('result-count');

            count.innerHTML = `<i class="fas fa-box-open"></i> <strong>${allProductos.length}</strong> producto${allProductos.length !== 1 ? 's' : ''}`;

            if (allProductos.length === 0) {
                area.innerHTML = '<div class="empty"><i class="fas fa-search"></i><h3>No se encontraron productos</h3><p>Prueba con otra búsqueda o categoría</p></div>';
                return;
            }

            area.innerHTML = '<div class="products-grid">' + ordenar(allProductos).map(p => `
                <div class="product" onclick="verProducto(${p.id_producto})">
                    <div class="product-img">
                        ${p.foto ? `<img src="${UPLOADS}${p.foto}" alt="${p.nombre}" loading="lazy">` : '<i class="fas fa-box"></i>'}
                        ${p.categoria ? `<span class="product-cat">${p.categoria.nombre}</span>` : ''}
                        ${esNuevo(p) ? '<span class="product-nuevo">NUEVO</span>' : ''}
                        ${p.foto ? '<span class="product-zoom"><i class="fas fa-search-plus"></i></span>' : ''}
                    </div>
                    <div class="product-body">
                        <div class="product-codigo">${p.codigo || ''}</div>
                        <div class="product-name">${p.nombre}</div>
                        <div class="product-price">$${formatNumber(p.precio)}</div>
                    </div>
                </div>
            `).join('') + '</div>';
        }

        function verProducto(id) {
            const p = allProductos.find(x => x.id_producto === id);
            if (!p) return;
            const overlay = document.getElementById('modal-overlay');
            const modalImg = document.getElementById('modal-img');
            modalImg.innerHTML = p.foto
                ? `<img src="${UPLOADS}${p.foto}" alt="${p.nombre}">`
                : '<i class="fas fa-box"></i>';
            if (p.foto) {
                modalImg.onclick = () => abrirFullscreen(UPLOADS + p.foto);
            } else {
                modalImg.onclick = null;
                modalImg.style.cursor = 'default';
            }
            document.getElementById('modal-body').innerHTML = `
                ${p.categoria ? `<span class="modal-cat">${p.categoria.nombre}</span>` : ''}
                <h2>${p.nombre}</h2>
                ${p.codigo ? `<div class="codigo">Código: ${p.codigo}</div>` : ''}
                <div class="precio">$${formatNumber(p.precio)}</div>
                ${p.descripcion ? `<p class="descripcion">${p.descripcion}</p>` : ''}
            `;
            overlay.classList.add('show');
        }

        function cerrarModal() {
            document.getElementById('modal-overlay').classList.remove('show');
        }

        function abrirFullscreen(src) {
            document.getElementById('img-fullscreen-src').src = src;
            document.getElementById('img-fullscreen').classList.add('show');
        }
        function cerrarFullscreen() {
            document.getElementById('img-fullscreen').classList.remove('show');
        }

        document.getElementById('modal-close').addEventListener('click', cerrarModal);
        document.getElementById('modal-overlay').addEventListener('click', (e) => {
            if (e.target.id === 'modal-overlay') cerrarModal();
        });
        document.getElementById('img-fullscreen-close').addEventListener('click', cerrarFullscreen);
        document.getElementById('img-fullscreen').addEventListener('click', (e) => {
            if (e.target.id === 'img-fullscreen' || e.target.tagName === 'IMG') cerrarFullscreen();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                cerrarFullscreen();
                cerrarModal();
            }
        });

        document.getElementById('search').addEventListener('input', debounce(cargarProductos, 350));
        document.getElementById('orden').addEventListener('change', renderProductos);

        // Init
        cargarCategorias();
        cargarProductos();
    </script>
</body>
</html>
